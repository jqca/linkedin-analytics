<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LinkedIn Analytics{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
      background: #f0f4f8;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Top Nav ─────────────────────────────────────────── */
    .topnav {
      background: #0f172a;
      height: 48px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .topnav-inner {
      max-width: 1200px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 8px;
    }
    .topnav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .topnav-brand svg { width: 22px; height: 22px; }
    .topnav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
    }
    .topnav-links a {
      color: rgba(255,255,255,.65);
      text-decoration: none;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .topnav-links a:hover { background: rgba(255,255,255,.08); color: #fff; }
    .topnav-links a.active {
      color: #fff;
      background: rgba(0,119,181,.35);
      border-bottom: 2px solid #0077B5;
    }
    .topnav-logout {
      color: rgba(255,255,255,.5);
      text-decoration: none;
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      transition: all .15s;
      flex-shrink: 0;
    }
    .topnav-logout:hover { color: #fff; border-color: rgba(255,255,255,.35); }

    /* ── Page Layout ─────────────────────────────────────── */
    .page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title span { font-size: 26px; }

    /* ── Cards ───────────────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
    }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      font-family: inherit;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: #0077B5; color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn-ghost {
      background: transparent;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }
    .btn-ghost:hover { background: #f8fafc; color: #0f172a; }
    .btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .btn-success:hover { background: #dcfce7; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }

    /* ── Status Badges ───────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .badge-draft { background: #f1f5f9; color: #64748b; }
    .badge-scheduled { background: #dbeafe; color: #1d4ed8; }
    .badge-posted { background: #dcfce7; color: #15803d; }

    /* ── Forms ───────────────────────────────────────────── */
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      color: #1e293b;
      background: #f8fafc;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0077B5;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,119,181,.1);
    }
    textarea {
      resize: vertical;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* ── Tabs ────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
      width: fit-content;
    }
    .tabs a {
      padding: 7px 18px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-decoration: none;
      transition: all .15s;
    }
    .tabs a.active {
      background: #fff;
      color: #0077B5;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }

    /* ── Inline form toggle ──────────────────────────────── */
    .add-form-wrap { margin-bottom: 24px; }
    .add-form-card {
      display: none;
      background: #f8fafc;
      border: 1.5px dashed #0077B5;
      border-radius: 14px;
      padding: 24px;
      margin-top: 12px;
    }
    .add-form-card.open { display: block; }

    /* ── Empty state ─────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: #94a3b8;
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-text { font-size: 14px; }

    /* ── Divider ─────────────────────────────────────────── */
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .char-count { font-size: 11px; color: #94a3b8; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="topnav-brand">
      <svg viewBox="0 0 24 24" fill="#0077B5"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      LinkedIn Analytics
    </a>
    <div class="topnav-links">
      <a href="/" {% if request.path == '/' %}class="active"{% endif %}>📊 分析</a>
      <a href="/beliefs" {% if '/beliefs' in request.path %}class="active"{% endif %}>💡 核心主張</a>
      <a href="/articles" {% if '/articles' in request.path %}class="active"{% endif %}>✍️ 記事管理</a>
    </div>
    <a href="/logout" class="topnav-logout">ログアウト</a>
  </div>
</nav>

<div class="page">
  {% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}
</body>
</html>
